name: Docker publish

on:
  workflow_call:
    inputs:
      image:
        description: Image name without a tag.
        type: string
        required: true
      context:
        description: Build context.
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile, relative to the context.
        type: string
        default: Dockerfile
      target:
        description: Stage to build. Empty builds the last stage.
        type: string
        default: ''
      platforms:
        description: Target platforms.
        type: string
        default: linux/amd64
      build-args:
        description: Newline-separated KEY=value pairs. Not for credentials.
        type: string
        default: ''
      buildkit-endpoint:
        description: BuildKit daemon to build on. The job pod has no Docker daemon of its own. Empty builds on the runner, for GitHub-hosted runners.
        type: string
        default: tcp://buildkitd.buildkit:1234
      runs-on:
        description: Runner to use.
        type: string
        default: build-hel-01-k8s
      container-image:
        description: Job container. Jobs on build-hel-01-k8s always run in one.
        type: string
        default: ghcr.io/ultimatelemon/ci-base:latest
    secrets:
      build-secrets:
        description: Newline-separated ID=value pairs handed to BuildKit.
        required: false
    outputs:
      image-ref:
        description: Digest of the pushed image.
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  publish:
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container-image }}

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        if: inputs.buildkit-endpoint != ''
        with:
          driver: remote
          endpoint: ${{ inputs.buildkit-endpoint }}

      # GitHub-hosted runners have a Docker daemon of their own.
      - uses: docker/setup-buildx-action@v4
        if: inputs.buildkit-endpoint == ''

      - name: log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}${{ inputs.target }}
