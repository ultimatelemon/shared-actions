name: Go quality

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding go.mod.
        type: string
        default: '.'
      go-version:
        description: Go version. Empty uses the minor of the toolchain or go directive in go.mod, at its latest patch.
        type: string
        default: ''
      golangci-lint-version:
        description: golangci-lint release tag, including the leading v.
        type: string
        default: v2.15.0
      runs-on:
        description: Runner to use.
        type: string
        default: build-hel-01-k8s
      container-image:
        description: Job container. Jobs on build-hel-01-k8s always run in one.
        type: string
        default: ghcr.io/ultimatelemon/ci-base:latest
      postgres-image:
        description: Postgres image for the service container. Empty runs no database.
        type: string
        default: ''
      rabbitmq-image:
        description: RabbitMQ image for a service container. Empty runs no RabbitMQ.
        type: string
        default: ''
      redis-image:
        description: Redis image for a service container. Empty runs no Redis.
        type: string
        default: ''
      s3-image:
        description: Image of an S3-compatible store that serves on port 9000 without a command, e.g. RustFS. Empty runs none.
        type: string
        default: ''
      postgres-db:
        description: Database created in the service container.
        type: string
        default: ci
      postgres-user:
        description: User created in the service container.
        type: string
        default: ci
      postgres-password:
        description: Password for that user. A throwaway container, not a secret.
        type: string
        default: ci
      pre-test-command:
        description: Command to run before go test, e.g. applying migrations. Empty runs nothing.
        type: string
        default: ''
      sqlc:
        description: Check that the code sqlc generates is up to date, with the sqlc config in working-directory.
        type: boolean
        default: false
      sqlc-version:
        description: sqlc release tag, including the leading v.
        type: string
        default: v1.31.1

jobs:
  quality:
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container-image }}

    permissions:
      contents: read

    # An empty image starts no service, so one job serves every combination of inputs.
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
          # The image trusts 127.0.0.1, and in Kubernetes mode the job reaches the
          # service there, so any password would work. Check it as on Docker.
          # A throwaway database needs no durability, and fsync under gVisor makes
          # CREATE/DROP DATABASE take seconds. initdb -c needs Postgres 16 or later.
          POSTGRES_INITDB_ARGS: >-
            --auth-host=scram-sha-256
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      rabbitmq:
        image: ${{ inputs.rabbitmq-image }}
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
          RABBITMQ_DEFAULT_VHOST: ci
      redis:
        image: ${{ inputs.redis-image }}
      s3:
        image: ${{ inputs.s3-image }}
        # Each image reads its own pair and ignores the other.
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key
          MINIO_ROOT_USER: ci-access-key
          MINIO_ROOT_PASSWORD: ci-secret-key

    steps:
      - uses: actions/checkout@v7

      # Kubernetes mode ignores a service's health check, so wait here instead.
      - name: wait for postgres
        if: inputs.postgres-image != ''
        shell: bash
        env:
          PGUSER: ${{ inputs.postgres-user }}
          PGPASSWORD: ${{ inputs.postgres-password }}
          PGDATABASE: ${{ inputs.postgres-db }}
          # Set on Docker, where a job container reaches a service by its name; empty in Kubernetes mode.
          NETWORK: ${{ job.container.network }}
        run: |
          if [ -n "$NETWORK" ]; then host=postgres; else host=localhost; fi
          ready=false
          for _ in $(seq 60); do
            if pg_isready -h "$host" -q; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::Postgres did not become ready"
            exit 1
          fi
          url="postgresql://$PGUSER:$PGPASSWORD@$host:5432/$PGDATABASE"
          {
            echo "TEST_DATABASE_URL=$url"
            echo "DATABASE_URL=$url"
          } >> "$GITHUB_ENV"

      # An empty image starts no service, so this step only waits for the ones asked for.
      - name: wait for services
        if: inputs.rabbitmq-image != '' || inputs.redis-image != '' || inputs.s3-image != ''
        shell: bash
        env:
          RABBITMQ: ${{ inputs.rabbitmq-image != '' }}
          REDIS: ${{ inputs.redis-image != '' }}
          S3: ${{ inputs.s3-image != '' }}
          # Set on Docker, where a job container reaches a service by its name; empty in Kubernetes mode.
          NETWORK: ${{ job.container.network }}
        run: |
          host() { if [ -n "$NETWORK" ]; then echo "$1"; else echo localhost; fi; }

          retry() {
            local name=$1
            shift
            for _ in $(seq 60); do
              if "$@" 2>/dev/null; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not become ready"
            exit 1
          }

          # A ready broker answers the AMQP protocol header with a frame of type 1.
          amqp() (
            exec 3<>"/dev/tcp/$1/5672"
            printf 'AMQP\0\0\11\1' >&3
            [ "$(timeout 5 head -c 1 <&3 | od -An -tx1 | tr -d ' ')" = 01 ]
          )

          redis() (
            exec 3<>"/dev/tcp/$1/6379"
            printf 'PING\r\n' >&3
            [ "$(timeout 5 head -c 5 <&3)" = +PONG ]
          )

          # 409 means the bucket exists already.
          bucket() {
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X PUT \
              --aws-sigv4 aws:amz:us-east-1:s3 --user ci-access-key:ci-secret-key \
              "http://$1:9000/ci-bucket")
            [ "$code" = 200 ] || [ "$code" = 409 ]
          }

          if [ "$RABBITMQ" = true ]; then
            h=$(host rabbitmq)
            retry RabbitMQ amqp "$h"
            echo "TEST_RABBITMQ_URL=amqp://ci:ci@$h:5672/ci" >> "$GITHUB_ENV"
          fi

          if [ "$REDIS" = true ]; then
            h=$(host redis)
            retry Redis redis "$h"
            echo "TEST_REDIS_URL=redis://$h:6379/0" >> "$GITHUB_ENV"
          fi

          if [ "$S3" = true ]; then
            h=$(host s3)
            retry S3 bucket "$h"
            {
              echo "TEST_S3_ENDPOINT=http://$h:9000"
              echo "TEST_S3_REGION=us-east-1"
              echo "TEST_S3_BUCKET=ci-bucket"
              echo "TEST_S3_ACCESS_KEY_ID=ci-access-key"
              echo "TEST_S3_SECRET_ACCESS_KEY=ci-secret-key"
            } >> "$GITHUB_ENV"
          fi

      - uses: ultimatelemon/shared-actions/.github/actions/go-checks@v2
        with:
          go-version: ${{ inputs.go-version }}
          golangci-lint-version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
          pre-test-command: ${{ inputs.pre-test-command }}
          sqlc: ${{ inputs.sqlc }}
          sqlc-version: ${{ inputs.sqlc-version }}
