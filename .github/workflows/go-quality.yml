name: Go quality

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding go.mod.
        type: string
        default: '.'
      go-version:
        description: Go version.
        type: string
        default: '1.25'
      golangci-lint-version:
        description: golangci-lint release tag, including the leading v.
        type: string
        default: v2.12.2
      runs-on:
        description: Runner to use.
        type: string
        default: ubuntu-latest

jobs:
  quality:
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: format
        if: '!cancelled()'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        if: '!cancelled()'
        run: go vet ./...

      - name: test
        if: '!cancelled()'
        run: go test ./...

      - name: build
        if: '!cancelled()'
        run: go build ./...

      - name: install golangci-lint
        if: '!cancelled()'
        env:
          VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/$VERSION/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "$VERSION"

      - name: lint
        if: '!cancelled()'
        run: golangci-lint run ./...
