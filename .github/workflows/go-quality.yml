name: Go quality

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding go.mod.
        type: string
        default: '.'
      go-version:
        description: Go version.
        type: string
        default: '1.25'
      golangci-lint-version:
        description: golangci-lint release tag, including the leading v.
        type: string
        default: v2.12.2
      runs-on:
        description: Runner to use.
        type: string
        default: build-hel-01-k8s
      container-image:
        description: Job container. Jobs on build-hel-01-k8s always run in one.
        type: string
        default: ghcr.io/ultimatelemon/ci-base:latest
      postgres-image:
        description: Postgres image for the service container. Empty runs no database.
        type: string
        default: ''
      postgres-db:
        description: Database created in the service container.
        type: string
        default: ci
      postgres-user:
        description: User created in the service container.
        type: string
        default: ci
      postgres-password:
        description: Password for that user. A throwaway container, not a secret.
        type: string
        default: ci
      pre-test-command:
        description: Command to run before go test, e.g. applying migrations. Empty runs nothing.
        type: string
        default: ''

jobs:
  quality:
    if: inputs.postgres-image == ''
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container-image }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - uses: ultimatelemon/shared-actions/.github/actions/go-checks@v2
        with:
          go-version: ${{ inputs.go-version }}
          golangci-lint-version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
          pre-test-command: ${{ inputs.pre-test-command }}

  quality-postgres:
    if: inputs.postgres-image != ''
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container-image }}

    permissions:
      contents: read

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
          # The image trusts 127.0.0.1, and in Kubernetes mode the job reaches the
          # service there, so any password would work. Check it as on Docker.
          # A throwaway database needs no durability, and fsync under gVisor makes
          # CREATE/DROP DATABASE take seconds. initdb -c needs Postgres 16 or later.
          POSTGRES_INITDB_ARGS: >-
            --auth-host=scram-sha-256
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off

    env:
      TEST_DATABASE_URL: >-
        postgresql://${{ inputs.postgres-user }}:${{ inputs.postgres-password
        }}@localhost:5432/${{ inputs.postgres-db }}
      DATABASE_URL: >-
        postgresql://${{ inputs.postgres-user }}:${{ inputs.postgres-password
        }}@localhost:5432/${{ inputs.postgres-db }}

    steps:
      - uses: actions/checkout@v7

      # Kubernetes mode ignores a service's health check, so wait here instead.
      - name: wait for postgres
        env:
          PGUSER: ${{ inputs.postgres-user }}
        run: |
          for _ in $(seq 60); do
            pg_isready -h localhost -q && exit 0
            sleep 2
          done
          echo "::error::Postgres did not become ready"
          exit 1

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - uses: ultimatelemon/shared-actions/.github/actions/go-checks@v2
        with:
          go-version: ${{ inputs.go-version }}
          golangci-lint-version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
          pre-test-command: ${{ inputs.pre-test-command }}
