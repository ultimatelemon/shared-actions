name: Node quality

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        default: '24'
      package-manager:
        description: npm or pnpm.
        type: string
        default: npm
      working-directory:
        description: Directory holding package.json.
        type: string
        default: '.'
      runs-on:
        description: Runner to use.
        type: string
        default: ubuntu-latest
      postgres-image:
        description: Postgres image for the service container. Empty runs no database.
        type: string
        default: ''
      postgres-db:
        description: Database created in the service container.
        type: string
        default: ci
      postgres-user:
        description: User created in the service container.
        type: string
        default: ci
      postgres-password:
        description: Password for that user. A throwaway container, not a secret.
        type: string
        default: ci
    secrets:
      npmrc:
        description: Contents of an .npmrc, for installs from a private registry.
        required: false

jobs:
  quality:
    if: inputs.postgres-image == ''
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ultimatelemon/shared-actions/.github/actions/node-checks@v1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}
          npmrc: ${{ secrets.npmrc }}

  quality-postgres:
    if: inputs.postgres-image != ''
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ inputs.postgres-user }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: >-
        postgresql://${{ inputs.postgres-user }}:${{ inputs.postgres-password
        }}@localhost:5432/${{ inputs.postgres-db }}
      DATABASE_URL: >-
        postgresql://${{ inputs.postgres-user }}:${{ inputs.postgres-password
        }}@localhost:5432/${{ inputs.postgres-db }}

    steps:
      - uses: actions/checkout@v7

      - uses: ultimatelemon/shared-actions/.github/actions/node-checks@v1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}
          npmrc: ${{ secrets.npmrc }}
