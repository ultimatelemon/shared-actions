name: Node quality

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        default: '26'
      package-manager:
        description: npm or pnpm.
        type: string
        default: npm
      working-directory:
        description: Directory holding package.json.
        type: string
        default: '.'
      runs-on:
        description: Runner to use.
        type: string
        default: build-hel-01-k8s
      container-image:
        description: Job container. Jobs on build-hel-01-k8s always run in one.
        type: string
        default: ghcr.io/ultimatelemon/ci-base:latest
      postgres-image:
        description: Postgres image for the service container. Empty runs no database.
        type: string
        default: ''
      postgres-db:
        description: Database created in the service container.
        type: string
        default: ci
      postgres-user:
        description: User created in the service container.
        type: string
        default: ci
      postgres-password:
        description: Password for that user. A throwaway container, not a secret.
        type: string
        default: ci
    secrets:
      npmrc:
        description: Contents of an .npmrc, for installs from a private registry.
        required: false

jobs:
  quality:
    runs-on: ${{ inputs.runs-on }}
    container: ${{ inputs.container-image }}

    permissions:
      contents: read

    # An empty image starts no service, so one job serves callers with and without a database.
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
          # The image trusts 127.0.0.1, and in Kubernetes mode the job reaches the
          # service there, so any password would work. Check it as on Docker.
          # A throwaway database needs no durability, and fsync under gVisor makes
          # CREATE/DROP DATABASE take seconds. initdb -c needs Postgres 16 or later.
          POSTGRES_INITDB_ARGS: >-
            --auth-host=scram-sha-256
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off

    steps:
      - uses: actions/checkout@v7

      # Kubernetes mode ignores a service's health check, so wait here instead.
      - name: wait for postgres
        if: inputs.postgres-image != ''
        shell: bash
        env:
          PGUSER: ${{ inputs.postgres-user }}
          PGPASSWORD: ${{ inputs.postgres-password }}
          PGDATABASE: ${{ inputs.postgres-db }}
          # Set on Docker, where a job container reaches a service by its name; empty in Kubernetes mode.
          NETWORK: ${{ job.container.network }}
        run: |
          if [ -n "$NETWORK" ]; then host=postgres; else host=localhost; fi
          ready=false
          for _ in $(seq 60); do
            if pg_isready -h "$host" -q; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::Postgres did not become ready"
            exit 1
          fi
          url="postgresql://$PGUSER:$PGPASSWORD@$host:5432/$PGDATABASE"
          {
            echo "TEST_DATABASE_URL=$url"
            echo "DATABASE_URL=$url"
          } >> "$GITHUB_ENV"

      - uses: ultimatelemon/shared-actions/.github/actions/node-checks@v2
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}
          npmrc: ${{ secrets.npmrc }}
