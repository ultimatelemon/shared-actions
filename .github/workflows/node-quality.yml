name: Node quality

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        default: '22'
      package-manager:
        description: npm or pnpm.
        type: string
        default: npm
      working-directory:
        description: Directory holding package.json.
        type: string
        default: '.'
      runs-on:
        description: Runner to use.
        type: string
        default: ubuntu-latest
    secrets:
      npmrc:
        description: Contents of an .npmrc, for installs from a private registry.
        required: false

jobs:
  quality:
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v7

      - name: enable pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: >-
            ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm'
            && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: npm auth
        env:
          NPMRC: ${{ secrets.npmrc }}
        run: |
          [ -n "$NPMRC" ] || exit 0
          printf '%s\n' "$NPMRC" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"

      - name: install
        run: >-
          ${{ inputs.package-manager == 'pnpm'
          && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      - name: lint
        if: '!cancelled()'
        run: ${{ inputs.package-manager }} run --if-present lint

      - name: format
        if: '!cancelled()'
        run: ${{ inputs.package-manager }} run --if-present format:check

      - name: typecheck
        if: '!cancelled()'
        run: ${{ inputs.package-manager }} run --if-present typecheck

      - name: test
        if: '!cancelled()'
        run: ${{ inputs.package-manager }} run --if-present test

      - name: build
        if: '!cancelled()'
        run: ${{ inputs.package-manager }} run --if-present build
